name: CI

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-gate:
    name: "Audit & Safety Gate (Blocking)"
    runs-on: ubuntu-latest
    env:
      SUBMIT_ALLOWED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff pip-audit pytest-xdist pytest-cov

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Verify Gitleaks detection active (Non-vacuous check)
        run: |
          # Prove that Gitleaks actively catches leaks and exits with code 1 under current config
          echo 'synthetic_leak: "c0389f35b05ae96d6e688d5aacad26bb"' > /tmp/synthetic_secret.txt
          if gitleaks dir /tmp/synthetic_secret.txt --config .gitleaks.toml --verbose; then
            echo "ERROR: Gitleaks failed to detect synthetic secret!" >&2
            exit 1
          else
            echo "SUCCESS: Gitleaks actively detected synthetic secret (exit code 1)."
          fi
          rm -f /tmp/synthetic_secret.txt

      - name: Gitleaks scan (Branch / PR diff)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            gitleaks git --log-opts "origin/${{ github.base_ref }}..HEAD" --verbose --redact --config .gitleaks.toml
          else
            git fetch origin main --depth=50 || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              gitleaks git --log-opts "origin/main..HEAD" --verbose --redact --config .gitleaks.toml
            else
              gitleaks git --log-opts "HEAD~1..HEAD" --verbose --redact --config .gitleaks.toml
            fi
          fi

      - name: Ruff blocking rules check
        run: |
          ruff check . --select F821,F811,B023,SIM222,RUF034,E722,PLW1510,ASYNC210,ASYNC251

      - name: Pip-audit declared dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Run Green Subset Tests
        run: |
          python -m pytest -q -n auto --deselect-known-failures

  full-test-run:
    name: "Full Test Suite (Informational / Non-blocking)"
    runs-on: ubuntu-latest
    needs: [audit-gate]
    continue-on-error: true
    env:
      SUBMIT_ALLOWED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-xdist pytest-cov

      - name: Run Full Test Suite with Coverage
        run: |
          python -m pytest -q -n auto --cov=ai_assistant --cov-report=term-missing:skip-covered
