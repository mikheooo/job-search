name: CI

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-gate:
    name: "Audit & Safety Gate (Blocking)"
    runs-on: ubuntu-latest
    env:
      SUBMIT_ALLOWED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff pip-audit pytest-xdist pytest-cov

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Ruff blocking rules check
        run: |
          ruff check . --select F821,F811,B023,SIM222,RUF034,E722,PLW1510,ASYNC210,ASYNC251

      - name: Pip-audit declared dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Run Green Subset Tests
        run: |
          python -m pytest -q -n auto \
            --ignore=tests/test_submission_verifier.py \
            --ignore=tests/test_stage79_digest_delivery_e2e.py \
            --ignore=tests/test_stage80_digest_crash_consistency.py \
            --ignore=tests/test_stage81_stale_digest_attempts.py \
            --ignore=tests/test_candidate_resume_parser.py \
            --ignore=tests/test_candidate_interview.py \
            --ignore=tests/test_hh_realtime_daemon_watchdog.py \
            --ignore=tests/test_t721_headless_provider.py \
            --ignore=tests/test_application_queue.py

  full-test-run:
    name: "Full Test Suite (Informational / Non-blocking)"
    runs-on: ubuntu-latest
    needs: [audit-gate]
    continue-on-error: true
    env:
      SUBMIT_ALLOWED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-xdist pytest-cov

      - name: Run Full Test Suite with Coverage
        run: |
          python -m pytest -q -n auto --cov=ai_assistant --cov-report=term-missing:skip-covered
