[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search"
version = "0.0.0"
description = "Personal job-search automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "requests>=2,<3",
    "openai>=1,<4",
    "websockets>=12,<18",
    "python-dotenv>=1,<2",
    "feedparser>=6,<7",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "pytest>=8,<10",
]

[project.optional-dependencies]
browser = ["playwright>=1,<2"]
gmail = [
    "google-auth>=2,<3",
    "google-api-python-client>=2,<3",
]
dev = [
    "playwright>=1,<2",
    "google-auth>=2,<3",
    "google-api-python-client>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_assistant*"]
exclude = ["tests*"]
