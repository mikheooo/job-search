# Noise we accept. Each entry needs a reason; delete the reason and the entry dies.
#
# These four are NOT part of the pre-config baseline (710) — they only appear once
# `target-version` is set explicitly. py311 is the truthful setting for this repo
# (venv is 3.11), so instead of lying about the version we name the exceptions.
ignore = [
    # UP017 (47): rewrites datetime.timezone.utc -> datetime.UTC. Valid on 3.11,
    #   but timezone.utc reads clearer and stays portable; 47 edits buy nothing.
    "UP017",
    # E402 (27): module-level import not at top of file. In cli.py these are
    #   deliberate lazy imports of heavy deps inside command handlers.
    "E402",
    # FURB162 (6): .format() on a str literal. Cosmetic.
    "FURB162",
    # E741 (3): ambiguous variable name (l, I, O). Would need real renames.
    "E741",
]

# ---------------------------------------------------------------------------
# ZONE POLICY for broad exception handling (see docs/ble001_triage.md, step 3)
# ---------------------------------------------------------------------------
# Not every `except Exception` is a bug. A watcher loop that dies on the first
# unexpected error is worse than one that logs and keeps polling. What matters
# is WHERE the handler sits:
#
#   GREEN ZONE  - CLI entry points and long-running pollers. A broad catch is
#                 the correct shape: the loop must survive one bad iteration.
#                 BLE001 is therefore ignored here.
#
#   RED ZONE    - the submission path: anything that can put an application in
#                 front of a real employer. Here a broad catch is a candidate
#                 fail-open, so BLE001 stays ON and is tracked by a test
#                 (tests/test_ble001_zone_policy.py) instead of being ignored.
#
# Deliberately NOT ignored anywhere: S110 (try-except-pass). Surviving a bad
# iteration is fine; swallowing it in silence is not. Every zone still has to
# log what it swallowed.
[lint.per-file-ignores]
"ai_assistant/cli.py" = ["BLE001"]
"ai_assistant/runner.py" = ["BLE001"]
"ai_assistant/watcher.py" = ["BLE001"]
"ai_assistant/*_watcher.py" = ["BLE001"]
"ai_assistant/hh_browser_launcher.py" = ["BLE001"]
# BLE001 (6): the fingerprint probe talks to endpoints it does not control - a
#   dead port, a half-open WebSocket, a browser that hangs mid-eval. Catching
#   broadly IS the point: one bad endpoint must not abort the whole comparison.
"tools/browser_fingerprint_probe.py" = ["BLE001"]
# BLE001 (4): the end-to-end probe drives a live browser against a live site -
#   a page can refuse to render, a selector can vanish between runs. Aborting
#   the whole probe on the first surprise throws away the diagnosis, which is
#   the only thing this tool exists to produce. Each catch prints what it ate.
"tools/e2e_pipeline_probe.py" = ["BLE001"]
