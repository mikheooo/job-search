# Ruff configuration for job-search.
#
# WHY THIS FILE EXISTS
# --------------------
# ruff 0.16.x ships a much wider default rule set than the classic E4/E7/E9/F,
# and this repo had no config at all. The lint backlog therefore floated with
# whatever ruff version happened to be on the machine. The `select` below is the
# resolved rule set of ruff 0.16.6, frozen explicitly: upgrading ruff must not
# silently change what we are measured against. Regenerate deliberately, not by
# accident.
#
# Deliberately NOT selected (would explode the backlog without adding signal):
#   E501 - line length, 2781 hits; needs ruff format first, not a lint pass
#   D    - docstring conventions
#   ANN  - type annotations; mypy already covers the parts that matter
#   COM/ISC/EM/T20/ERA/FBT - style, not correctness
#
# Regenerate with: python <temp>/gen_ruff_toml.py   (see docs/ble001_triage.md)

target-version = "py311"

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "baseline_stage14_snapshot",
    "snapshot_stage15_current",
    "graphify-out",
]

